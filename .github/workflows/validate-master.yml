name: Validate SmartSchool Master

on:
  push:
    branches: [master-development]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-master-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build
