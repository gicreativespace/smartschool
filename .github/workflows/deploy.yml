name: Deploy SmartSchool to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Verify Vite production output
        run: |
          set -eu
          test -f dist/index.html
          test -f dist/manifest.json
          test -d dist/assets
          grep -q 'src="/smartschool/assets/' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html
          grep -q 'href="/smartschool/manifest.json"' dist/index.html
          echo "Verified production HTML:"
          cat dist/index.html
          echo "Verified manifest and compiled assets for /smartschool/."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
